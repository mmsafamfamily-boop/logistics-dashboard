<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مستودع متجر أناقة للتدريب</title>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; text-align: center; padding: 40px; }
        .box { background: white; padding: 30px; border-radius: 10px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn { background: #10b981; color: white; border: none; padding: 12px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 16px; margin: 10px; }
        .num { font-size: 48px; font-weight: bold; color: #1e3a8a; margin: 20px 0; }
    </style>
</head>
<body>

<div class="box">
    <h2>لوحة تحكم المستودع التفاعلية 📦</h2>
    <p>إجمالي قمصان المخزون الحالي (Inventory Status):</p>
    <div class="num" id="stock-count">50</div>
    
    <button class="btn" onclick="addStock()">📦 استلام توريد (+10 قطع)</button>
    <button class="btn" style="background:#ef4444;" onclick="sellStock()">🛒 تسجيل مبيعات (-5 قطع)</button>
</div>

<script>
    let currentStock = 50;
    function updateDisplay() {
        document.getElementById('stock-count').innerText = currentStock;
    }
    function addStock() {
        currentStock += 10;
        updateDisplay();
    }
    function sellStock() {
        if (currentStock >= 5) {
            currentStock -= 5;
            updateDisplay();
        } else {
            alert("المخزون غير كافٍ للصرف!");
        }
    }
</script>

</body>
</html>
