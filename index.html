<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم الشاملة في المستودع 📦</title>
    <style>
        /* تغيير ألوان الخلفية العامة إلى درجات هادئة ومريحة جداً للعين */
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: #eef2f5; /* لون رمادي مزرق خفيف وناعم */
            padding: 30px; 
            margin: 0; 
            color: #334155;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        
        /* الصناديق بلون أبيض دافئ ومريح */
        .panel { 
            background: #ffffff; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 12px rgba(148, 163, 184, 0.1); 
            margin-bottom: 25px; 
        }
        h2 { margin-top: 0; color: #1e293b; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; font-size: 20px; }
        
        /* تصميم الجدول بألوان خافتة */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; text-align: right; }
        th, td { padding: 14px; border-bottom: 1px solid #f1f5f9; }
        th { background: #f8fafc; color: #475569; font-weight: bold; }
        
        /* أزرار العمليات بألوان ناعمة وليست فاقعة */
        .btn-sm { padding: 6px 12px; font-size: 12px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; margin-left: 5px; transition: opacity 0.2s; }
        .btn-sm:hover { opacity: 0.9; }
        .btn-in { background: #0ea5e9; } /* أزرق سماوي ناعم للتوريد */
        .btn-out { background: #f43f5e; } /* وردي داكن هادئ للبيع */
        .btn-delete { background: #94a3b8; } /* رمادي كلاسيكي للحذف */
        .btn-delete:hover { background: #64748b; }
        
        /* نموذج إضافة منتج جديد */
        .form-group { display: flex; gap: 15px; margin-top: 15px; flex-wrap: wrap; }
        .form-group input, .form-group select { 
            flex: 1; 
            min-width: 140px; 
            padding: 12px; 
            border: 1px solid #cbd5e1; 
            border-radius: 8px; 
            font-size: 14px; 
            box-sizing: border-box;
            background-color: #f8fafc; /* خلفية الخانات داكنة قليلاً لتريح العين */
            color: #334155;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #0ea5e9;
            background-color: #fff;
        }
        .btn-add { background: #475569; color: white; border: none; padding: 12px 24px; font-weight: bold; border-radius: 8px; cursor: pointer; min-width: 150px; }
        .btn-add:hover { background: #334155; }
        
        /* شارات الحالة الملونة بهدوء */
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; display: inline-block; }
        .badge-success { background: #e0f2fe; color: #0369a1; } /* تدرج أزرق مريح للتوفر */
        .badge-danger { background: #ffe4e6; color: #b91c1c; } /* تدرج وردي هادئ للانخفاض */
    </style>
</head>
<body>

<div class="container">
    
    <!-- القسم الأول: جدول جميع المنتجات الحالية -->
    <div class="panel">
        <h2>📦 جدول إدارة المخزون الفوري (All Products)</h2>
        <table>
            <thead>
                <tr>
                    <th>رمز المنتج (SKU)</th>
                    <th>نوع المنتج</th>
                    <th>اسم المنتج</th>
                    <th>الوصف / المقاس</th>
                    <th>الكمية الحالية</th>
                    <th>حالة التوفر</th>
                    <th>العمليات اللوجستية</th>
                </tr>
            </thead>
            <tbody id="inventory-table-body">
                <!-- جافاسكريبت سيملاً البيانات هنا تلقائياً -->
            </tbody>
        </table>
    </div>

    <!-- القسم الثاني: نموذج إضافة صنف جديد للمستودع -->
    <div class="panel">
        <h2>➕ إضافة منتج جديد للمخزن (Add New Item)</h2>
        <div class="form-group">
            <input type="text" id="new-sku" placeholder="الرمز (مثال: CAP-RED)">
            <select id="new-category">
                <option value="كاب">كاب (Cap)</option>
                <option value="قميص">قميص (Shirt)</option>
                <option value="تيشيرت">تيشيرت (T-Shirt)</option>
            </select>
            <input type="text" id="new-name" placeholder="اسم المنتج (مثال: كاب أحمر رياضي)">
            <input type="text" id="new-desc" placeholder="الوصف أو المقاس (مثال: فري سايز)">
            <input type="number" id="new-stock" placeholder="الكمية الابتدائية (مثال: 50)">
            <button class="btn-add" onclick="addNewProduct()">➕ إضافة للمستودع</button>
        </div>
    </div>

</div>

<script>
    // مصفوفة المنتجات الافتراضية
    let products = [
        { sku: 'SHIRT-BLK-S', category: 'قميص', name: 'قميص أسود كلاسيك', desc: 'مقاس S', stock: 45 },
        { sku: 'CAP-WHT-F', category: 'كاب', name: 'كاب صيفي أبيض', desc: 'فري سايز', stock: 12 }
    ];

    function updateTable() {
        const tbody = document.getElementById('inventory-table-body');
        tbody.innerHTML = ''; 

        products.forEach((product, index) => {
            let statusBadge = product.stock <= 15 ? 
                '<span class="badge badge-danger">مخزون منخفض ⚠️</span>' : 
                '<span class="badge badge-success">متوفر ✅</span>';

            tbody.innerHTML += `
                <tr>
                    <td><code style="color:#0ea5e9; font-weight:bold;">${product.sku}</code></td>
                    <td><strong>${product.category}</strong></td>
                    <td>${product.name}</td>
                    <td><span style="color: #64748b; font-size: 13px;">${product.desc}</span></td>
                    <td style="font-weight: bold; font-size: 16px;">${product.stock}</td>
                    <td>${statusBadge}</td>
                    <td>
                        <button class="btn-sm btn-in" onclick="changeStock(${index}, 10)">📦 توريد +10</button>
                        <button class="btn-sm btn-out" onclick="changeStock(${index}, -5)">🛒 بيع -5</button>
                        <button class="btn-sm btn-delete" onclick="deleteProduct(${index})">🗑️ إلغاء صنف</button>
                    </td>
                </tr>
            `;
        });
    }

    function changeStock(index, amount) {
        if (products[index].stock + amount >= 0) {
            products[index].stock += amount;
            updateTable();
        } else {
            alert("لا يمكن البيع! المخزون الحالي لا يكفي الصرف.");
        }
    }

    function addNewProduct() {
        const skuInput = document.getElementById('new-sku');
        const categoryInput = document.getElementById('new-category');
        const nameInput = document.getElementById('new-name');
        const descInput = document.getElementById('new-desc');
        const stockInput = document.getElementById('new-stock');

        if (skuInput.value === '' || nameInput.value === '' || stockInput.value === '') {
            alert("الرجاء ملء الرمز واسم المنتج والكمية أولاً!");
            return;
        }

        let newProd = {
            sku: skuInput.value.toUpperCase(),
            category: categoryInput.value,
            name: nameInput.value,
            desc: descInput.value || 'فري سايز',
            stock: parseInt(stockInput.value) || 0
        };

        products.push(newProd); 
        updateTable(); 

        skuInput.value = ''; nameInput.value = ''; descInput.value = ''; stockInput.value = '';
    }

    function deleteProduct(index) {
        if (confirm("هل أنت متأكد من إلغاء وحذف هذا الصنف من المستودع تماماً؟")) {
            products.splice(index, 1); 
            updateTable(); 
        }
    }

    updateTable();
</script>

</body>
</html>
